<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari Kamu Yang Spesial 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
        }
        
        .sparkle {
            animation: sparkle 2s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .bounce-cute {
            animation: bounce-cute 2s infinite;
        }
        
        @keyframes bounce-cute {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-gradient {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .pulse-heart {
            animation: pulse-heart 1.5s infinite;
        }
        
        @keyframes pulse-heart {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Header dengan emoji lucu -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4 bounce-cute">🎀</div>
            <h1 class="text-3xl font-bold text-white mb-2">Countdown Spesial</h1>
            <p class="text-pink-100 text-lg">Menuju 23 Agustus 2025</p>
            <div class="flex justify-center space-x-2 mt-3">
                <span class="sparkle text-2xl">✨</span>
                <span class="sparkle text-2xl" style="animation-delay: 0.5s">💖</span>
                <span class="sparkle text-2xl" style="animation-delay: 1s">✨</span>
            </div>
        </div>

        <!-- Countdown Card -->
        <div class="card-gradient rounded-3xl p-6 shadow-2xl mb-6">
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-white bg-opacity-20 rounded-2xl p-4">
                    <div id="days" class="text-3xl font-bold text-white">00</div>
                    <div class="text-pink-100 text-sm font-medium">Hari</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-2xl p-4">
                    <div id="hours" class="text-3xl font-bold text-white">00</div>
                    <div class="text-pink-100 text-sm font-medium">Jam</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-2xl p-4">
                    <div id="minutes" class="text-3xl font-bold text-white">00</div>
                    <div class="text-pink-100 text-sm font-medium">Menit</div>
                </div>
                <div class="bg-white bg-opacity-20 rounded-2xl p-4">
                    <div id="seconds" class="text-3xl font-bold text-white">00</div>
                    <div class="text-pink-100 text-sm font-medium">Detik</div>
                </div>
            </div>
        </div>

        <!-- Pesan lucu -->
        <div class="bg-white bg-opacity-10 rounded-2xl p-6 text-center">
            <div class="text-4xl mb-3 pulse-heart">💕</div>
            <p id="message" class="text-white text-lg font-medium mb-3">Sabar ya cantik, tinggal sebentar lagi! 🥰</p>
            <div class="flex justify-center space-x-3">
                <span class="text-2xl">🌸</span>
                <span class="text-2xl">🦋</span>
                <span class="text-2xl">🌺</span>
            </div>
        </div>


        <!-- Tombol lucu -->
        <div class="text-center mt-4">
            <button onclick="showSurprise()" class="hidden bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-all duration-200" id="surpriseButton">
                Klik untuk kejutan! 🎁
            </button>
        </div>

      

    <script>
        // Set tanggal target - 23 Agustus 2025
        const targetDate = new Date('2025-08-23T19:00:00').getTime();
        
        // Pesan-pesan lucu yang berganti
        const messages = [
            "Sabar ya Cheyank, tinggal sebentar lagi! 🥰",
            "Waktunya hampir tiba, siap-siap ya Ai Sopiah! 💖",
            "Hitung Mundur untuk hari spesial Cheyank♡! ✨",
            "Semangat menunggu ya Ai Sopiah tersayang! 👑",
            "Hari istimewa-mu, sudah dekat! 🌟"
        ];
        
        let messageIndex = 0;
        
        function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;
    
    if (distance < 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.getElementById('message').textContent = 'Selamat! Hari spesial sudah tiba! 🎉';

        // tampilkan tombol
        document.getElementById('surpriseButton').classList.remove('hidden');
        return;
    }
    
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
    document.getElementById('days').textContent = days.toString().padStart(2, '0');
    document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
    document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
    document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
}

        
        function changeMessage() {
            document.getElementById('message').textContent = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;
        }
        
        function showSurprise() {
            
  
            window.location.href = "next/index.html"; // ganti dengan nama file tujuanmu
            return;
        }
        
        // Update countdown setiap detik
        setInterval(updateCountdown, 1000);
        
        // Ganti pesan setiap 3 detik
        setInterval(changeMessage, 3000);
        
        // Jalankan pertama kali
        updateCountdown();
    </script>

</html>
